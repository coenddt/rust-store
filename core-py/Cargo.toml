[package]
name = "rust-store-py"
version = "2.0.2"
edition = "2021"
description = "rust-store 的 Python 绑定（PyO3）：把 core 的 Command 契约暴露给 Python Host"
publish = false

[lib]
name = "rust_store_py"
crate-type = ["cdylib"]
path = "src/lib.rs"
# cdylib 的 Rust 测试二进制需 Python 宿主加载运行时符号，无宿主时直接
# STATUS_DLL_NOT_FOUND。本 crate 的对拍测试在 test/parity_test.py（pytest 跑），
# Rust 侧无单测 —— 关闭 lib test，CI 只对 core 跑 `cargo test`（见 ci.yml）。
test = false

[dependencies]
rust-store-core = { path = "../core" }
serde_json = "1"
# PyO3 0.27 起才完整支持 Python 3.14 final（本机 3.14.4）
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }
