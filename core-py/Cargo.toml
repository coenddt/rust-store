[package]
name = "mongo-store-py"
version = "0.1.0"
edition = "2021"
description = "mongo-store 的 Python 绑定（PyO3）：把 core 的 Command 契约暴露给 Python Host"
publish = false

[lib]
name = "mongo_store_py"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
mongo-store-core = { path = "../core" }
serde_json = "1"
# PyO3 0.27 起才完整支持 Python 3.14 final（本机 3.14.4）
pyo3 = { version = "0.29", features = ["extension-module"] }
