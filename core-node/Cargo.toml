[package]
name = "rust-store-node"
version = "2.0.4"
edition = "2021"
description = "rust-store 的 Node 绑定（napi-rs）：把 core 的 Command 契约暴露给 JS Host"
publish = false

[lib]
name = "rust_store_node"
crate-type = ["cdylib"]
path = "src/lib.rs"
# cdylib 的 Rust 测试二进制需 Node 宿主加载运行时符号，无宿主时直接
# STATUS_DLL_NOT_FOUND。本 crate 的对拍测试在 test/*.test.js（Node 跑），
# Rust 侧无单测 —— 关闭 lib test，CI 只对 core 跑 `cargo test`（见 ci.yml）。
test = false

[dependencies]
rust-store-core = { path = "../core" }
serde_json = "1"
# napi4 提供 `threadsafe_function` 模块，其中含 `JsValuesTupleIntoVec` 的
# 单值 blanket impl，`FunctionRef` 依赖它才能以 `serde_json::Value` 作实参。
napi = { version = "2", features = ["napi4", "serde-json"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
