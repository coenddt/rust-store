[package]
name = "rust-store-core"
version = "2.0.4"
edition = "2021"
description = "One data engine for MongoDB, MySQL, PostgreSQL and SQLite: a MongoDB-style GQL query language, permission checks, computed columns, command planning and SQL dialect translation. Pure logic, no IO."
# license 供 crates.io 展示 SPDX 标识；license-file 让 MIT 原文随 .crate 一同分发
# （MIT 要求副本携带许可声明）。两者同时给出时 cargo 会提示「只需其一」，此处为有意为之。
license = "MIT"
license-file = "../LICENSE"
repository = "https://github.com/coenddt/rust-store"
homepage = "https://coenddt.github.io/rust-store/"
documentation = "https://docs.rs/rust-store-core"
readme = "README.md"
keywords = ["gql", "mongodb", "sql", "query-builder", "multi-database"]
categories = ["database", "database-implementations", "parser-implementations"]

[lib]
name = "rust_store_core"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
# CoreError 结构化错误（FFI 边界可程序化穷举，见 src/error.rs）
thiserror = "2"

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "parity_computes"
path = "tests/parity_computes.rs"

[[test]]
name = "parity_commands"
path = "tests/parity_commands.rs"

[[test]]
name = "parity_write"
path = "tests/parity_write.rs"

[[test]]
name = "parity_fnfns"
path = "tests/parity_fnfns.rs"

[[test]]
name = "parity_dialect"
path = "tests/parity_dialect.rs"

[[test]]
name = "parity_federation"
path = "tests/parity_federation.rs"
