name: release-npm

# 发布 rust-store-node（core-node 的 napi-rs 绑定）到 npm。
#
# 触发：推 v* tag，或手动 dispatch。
# 凭证：NPM_TOKEN secret（actions/setup-node 注入 NODE_AUTH_TOKEN）。
#       任何 token 都不得写入仓库/文档，只能经 CI secrets 注入。
#
# PyPI（rust-store-py）见 release-pypi.yml，两文件互不重叠。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 构建：平台 × 架构 ────────────────────────────────────────────────
  build-npm:
    name: npm binding (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # npm provenance（OIDC）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13（intel runner）已被 GitHub 淘汰，job 会永久排队；
          # 改在 arm64 上交叉编译 x86_64-apple-darwin（Xcode 工具链同时支持两种架构）
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: core-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      # npm install 而非 npm ci：平台子包被 optionalDependencies 钉在当前版本，
      # 而该版本要等本工作流 publish job 的 napi prepublish 才产出，lockfile 无法预先
      # 记录其 integrity；npm ci 会因 package.json 与 lock 不同步直接失败。
      # 未发布的平台包在 install 阶段只会告警（optional 语义），不影响后续构建。
      - run: npm install
      - name: Build binding
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: core-node/*.node

  # ── 发布：平台子包 + 主包 ────────────────────────────────────────────
  publish-npm:
    name: npm publish
    needs: build-npm
    # tag 推送发布；手动 dispatch 亦可发布（用于修复中断的发布，版本以 package.json 为准）
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: core-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      # 同 build job：见上面对 npm install 的说明。
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: core-node/artifacts
      - name: Create npm dirs
        run: npx napi create-npm-dir -t .
      - name: Stage platform binaries
        run: npx napi artifacts
      - name: Pack & inspect (must not contain target/ node_modules/ logs)
        run: npm pack --dry-run
      - name: Publish (platform sub-packages + main)
        # 平台子包可能已在中断的重跑中发布过：`napi prepublish` 遇到已存在版本会 403，
        # 此处容忍该情形（版本与 optionalDependencies 的同步先于发布执行，不受影响）；
        # 主包用 `--ignore-scripts` 发布，避免 prepublishOnly 再次重复发布平台子包。
        run: |
          npx napi prepublish -t npm --skip-gh-release || echo "::warning::部分平台子包已存在，跳过重复发布"
          npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
