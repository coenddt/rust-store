name: release-pypi

# 发布 rust-store-py（core-py 的 PyO3 绑定）到 PyPI。
#
# 凭证：PyPI Trusted Publishing（OIDC），不使用长期 token。
# 前置（PyPI 侧一次性配置 https://pypi.org/manage/account/publishing/）：
#   PyPI Project Name = rust-store-py
#   Owner             = coenddt
#   Repository name   = rust-store
#   Workflow name     = release-pypi.yml
#   Environment name  = （留空）
#
# 触发：推 v* tag，或手动 dispatch（手动触发只构建，不发布）。
#
# 注：PyO3 未开启 abi3，wheel 与 CPython 版本一一对应，故用 --find-interpreter
#     对容器/环境内可见的解释器逐个出 wheel；本包不产出 sdist——core-py 依赖
#     仓库外的 path 依赖 ../core，单包 sdist 无法自举构建。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── manylinux（x86_64 / aarch64）───────────────────────────────────
  linux:
    name: manylinux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core-py
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: core-py/dist/*.whl

  # ── musllinux（x86_64）────────────────────────────────────────────
  musllinux:
    name: musllinux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core-py
          target: x86_64
          manylinux: musllinux_1_2
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-x86_64
          path: core-py/dist/*.whl

  # ── Windows（x64）─────────────────────────────────────────────────
  windows:
    name: windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core-py
          target: x64
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: core-py/dist/*.whl

  # ── macOS（x86_64 / arm64）────────────────────────────────────────
  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core-py
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: core-py/dist/*.whl

  # ── 发布（仅 tag 触发）─────────────────────────────────────────────
  publish:
    name: PyPI publish (Trusted Publishing)
    needs: [linux, musllinux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
